<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe & Verify — תחושה ואימות</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">◆ VIBE & VERIFY</span>
      <span class="brand-mid">MULTI-AGENT INTELLIGENCE</span>
      <span class="brand-date" id="report-date"></span>
    </div>
  </header>

  <div id="app">
    <!-- Loading State -->
    <div id="loading-view" class="loading-view">
      <div class="loading-spinner"></div>
      <p>טוען דוח…</p>
    </div>

    <!-- Error State -->
    <div id="error-view" class="error-view hidden">
      <h2>לא נמצא דוח</h2>
      <p>הרץ בטרמינל: <code>node run.js "הרעיון שלך"</code> ורענן את הדף.</p>
    </div>

    <!-- Report Dashboard -->
    <div id="report-view" class="hidden">

      <!-- Hero -->
      <section class="hero-section">
        <div class="hero-badge">THE VERDICT</div>
        <h1 class="hero-title">THE<br><span class="hero-accent">VERDICT.</span></h1>
        <p class="hero-idea" id="hero-idea"></p>
        <div class="hero-agents" id="hero-agents"></div>
      </section>

      <!-- Tab Nav -->
      <nav class="tab-nav" id="tab-nav">
        <button class="tab active" data-tab="verdict">פס״ד</button>
        <button class="tab" data-tab="research">מחקר</button>
        <button class="tab" data-tab="agents">סוכנים</button>
        <button class="tab" data-tab="synthesis">סינתזה</button>
        <button class="tab" data-tab="actions">צעדים</button>
      </nav>

      <!-- Tab: Verdict -->
      <section class="tab-content active" id="tab-verdict">
        <div id="verdict-grid"></div>
        <div id="blue-ocean"></div>
      </section>

      <!-- Tab: Research -->
      <section class="tab-content" id="tab-research">
        <div id="research-highlights"></div>
        <div id="research-market"></div>
        <div id="research-competitors"></div>
        <div id="research-trends"></div>
        <div id="research-why-now"></div>
        <div id="research-sources"></div>
      </section>

      <!-- Tab: Agents -->
      <section class="tab-content" id="tab-agents">
        <div id="agents-grid"></div>
      </section>

      <!-- Tab: Synthesis -->
      <section class="tab-content" id="tab-synthesis">
        <div id="syn-tensions"></div>
        <div id="syn-risks"></div>
        <div id="syn-scenarios"></div>
        <div id="syn-questions"></div>
      </section>

      <!-- Tab: Actions -->
      <section class="tab-content" id="tab-actions">
        <div id="action-moves"></div>
        <div id="action-download"></div>
      </section>

    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
